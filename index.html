<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小人になって家の中を逃げろ | 体2cmの3Dバカゲー</title>
<meta name="description" content="賞味期限2019年のヨーグルトを食べたら体が2cmに。デンタルフロスを振り子にソファと本棚とカーテンを渡り、ルンバと猫とおかんの掃除機から逃げて、冷蔵庫の上の非常口へ。スマホのブラウザで遊べる3Dバカゲー。">
<meta property="og:type" content="website">
<meta property="og:title" content="小人になって家の中を逃げろ">
<meta property="og:description" content="体2cm。デンタルフロスで家具を渡り、ルンバと猫とおかんの掃除機から逃げて冷蔵庫の上の非常口へ。スマホのブラウザで遊べる。">
<meta property="og:image" content="https://tom3games.github.io/kobito-escape/og.png?v=4">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://tom3games.github.io/kobito-escape/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#00a65a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/biz700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/klee600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=6">
<link rel="modulepreload" href="dist/game.js?v=6">
</head>
<body>
<div id="view"></div>
<canvas id="speedfx"></canvas><div id="hitflash"></div><div id="danger"></div>

<!-- タイトル -->
<section id="title" class="hidden">
  <div class="plate">
    <svg class="plate-man" viewBox="0 0 68 76" aria-hidden="true"><use href="#runner"/></svg>
    <h1><span data-t="logo1"></span><span data-t="logo2"></span><span data-t="logo3"></span></h1>
  </div>
  <p class="note" data-t="story"></p>
  <div class="t-bottom">
    <button id="btnStart" class="go"><span data-t="start"></span></button>
    <div class="small-row"><button id="btnHow" data-t="how"></button><button id="btnLang" data-t="lang"></button><button id="btnMute"></button></div>
  </div>
</section>

<!-- 遊び方: 冷蔵庫のメモ -->
<section id="how" class="hidden">
  <div class="memo">
    <i class="magnet"></i>
    <h2 data-t="howTitle"></h2>
    <ol id="howList"></ol>
    <button class="tag" data-close data-t="ok"></button>
    <p class="credit" data-t="credit"></p>
  </div>
</section>

<!-- 遊び中 -->
<section id="hud" class="hidden">
  <div id="plasters" aria-hidden="true"></div>
  <div id="toys" aria-hidden="true"><div id="toyTokens"></div><i id="toyBar"></i></div>
  <div id="sign" class="sign"><svg class="man" viewBox="0 0 68 76" aria-hidden="true"><use href="#runner"/></svg><svg id="signArrow" class="arw" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 L22 13 H15.5 V23 H8.5 V13 H2Z"/></svg><div class="sign-txt"><b id="signName"></b><span id="signDist"></span></div></div>
  <button id="btnPause" class="timer"><span id="tClock">0:00</span></button>
  <div id="momCut" class="hidden" aria-hidden="true"><img alt=""></div>
  <div id="say" class="say hidden"></div>
  <div id="miss" class="miss hidden"><span data-t="tooFar"></span></div>
  <div class="threat hidden" data-k="roomba"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#24262b"/><circle cx="14" cy="15" r="5" fill="#f8f8f4"/><circle cx="26" cy="15" r="5" fill="#f8f8f4"/><circle cx="14" cy="16" r="2.4"/><circle cx="26" cy="16" r="2.4"/></svg></div>
  <div class="threat hidden" data-k="cat"><svg viewBox="0 0 40 40"><path d="M6 6 L14 13 Q20 11 26 13 L34 6 L35 25 Q33 36 20 36 Q7 36 5 25Z" fill="#d98a3d"/><ellipse cx="14" cy="22" rx="3.5" ry="4.4" fill="#e6cd3e"/><ellipse cx="26" cy="22" rx="3.5" ry="4.4" fill="#e6cd3e"/><rect x="13.3" y="18" width="1.4" height="8"/><rect x="25.3" y="18" width="1.4" height="8"/></svg></div>
  <div class="threat hidden" data-k="vac"><svg viewBox="0 0 40 40"><path d="M23 2 L28 4 L22 22 L16 20Z" fill="#8f9499"/><rect x="3" y="21" width="34" height="11" rx="3" fill="#2b2d31"/><rect x="5" y="30" width="30" height="3" fill="#b33a2b"/></svg></div>
  <div id="stick" class="stick"><div class="knob"><i></i><i></i><i></i><i></i></div></div>
  <button id="btnWire" class="floss" aria-label="wire"><span class="lid"></span><span class="cut"></span><small data-t="flossLabel"></small><svg class="thread" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 2 C38 14 22 22 30 34" fill="none" stroke="#e8fff5" stroke-width="3"/></svg></button>
</section>

<!-- 一時停止 -->
<section id="pause" class="hidden">
  <div class="memo tiny">
    <i class="magnet"></i>
    <h2 data-t="paused"></h2>
    <button id="btnResume" class="tag" data-t="resume"></button>
    <button id="btnQuit" class="txt" data-t="quit"></button>
  </div>
</section>

<!-- 結果の前: おかんの大写し（漫画のコマ。タップで飛ばす） -->
<section id="reveal" class="hidden">
  <div class="rev-wrap"><div id="revFrame"></div><p id="revLine"></p></div>
</section>

<!-- 結果: 紙 -->
<section id="result" class="hidden">
  <div class="paper-wrap"><canvas id="paper" width="720" height="1040"></canvas></div>
  <div class="res-row">
    <button id="btnAgain" class="tag" data-t="again"></button>
    <button id="btnSave" data-t="save"></button>
    <a id="btnPost" target="_blank" rel="noopener" data-t="post"></a>
    <button id="btnTitle" data-t="toTitle"></button>
  </div>
</section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mouseToy" viewBox="0 0 40 40"><path d="M9 26 C3 30 3 36 11 35" fill="none" stroke="#c33a2f" stroke-width="2.4" stroke-linecap="round"/><path d="M8 26 C8 15 19 11 27 15 L37 25 C38 28 36 29 33 29 L13 30 C10 30 8 29 8 26Z" fill="#9b9ea5" stroke="#1d1a12" stroke-width="2"/><circle cx="24" cy="13" r="5" fill="#e9a3af" stroke="#1d1a12" stroke-width="2"/><circle cx="31" cy="22" r="1.7" fill="#101010"/><circle cx="37" cy="26" r="1.6" fill="#e58a9a"/><path d="M16 15 V8 M13 6 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0" fill="none" stroke="#c9b458" stroke-width="2"/></symbol><symbol id="runner" viewBox="-34 -38 68 76"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="-27" r="6.5" fill="currentColor" stroke="none"/><path d="M5 -16 L-2 4 L14 13 L10 30 M-2 4 L-12 16 L-26 16 M4 -14 L17 -7 L26 -13 M4 -14 L-10 -13 L-17 -2"/></g></symbol></svg>

<!-- ロード画面: 糸が出てくるデンタルフロスのケースと、縮んでいく人 -->
<div id="boot" class="boot">
  <svg class="boot-art" viewBox="0 0 200 180" aria-hidden="true">
    <path class="b-thread" d="M104 62 C120 40 88 26 112 8" fill="none" stroke="#e8fff5" stroke-width="3"/>
    <rect x="58" y="62" width="84" height="104" rx="16" fill="#7fd5bd"/><rect x="58" y="62" width="84" height="36" rx="14" fill="#f4faf7"/><rect x="92" y="60" width="24" height="6" fill="#8c9aa3"/>
    <text x="100" y="134" text-anchor="middle" font-family="BIZ UDPGothic,sans-serif" font-size="15" font-weight="700" fill="#17433a">FLOSS</text>
    <g class="b-man" fill="#f4faf7" transform="translate(160 164)"><circle cx="0" cy="-30" r="6"/><rect x="-4" y="-24" width="8" height="24" rx="3"/></g>
  </svg>
  <p class="boot-msg" data-t="loading">体が縮んでいます</p>
  <div class="boot-bar"><i id="bootBar"></i></div>
</div>
<script>
// ロード画面の進み具合（three の読み込み数を game.js が __bootSet で渡す）。遅い回線でも12秒で必ず消す
(function(){
  var bar=document.getElementById('bootBar'),k=0,real=false;
  function draw(){bar.style.transform='scaleX('+k.toFixed(3)+')'}
  window.__bootSet=function(v){real=true;if(v>k){k=Math.min(1,v);draw()}};
  var t=setInterval(function(){if(real||window.__bootDone){clearInterval(t);return}k=Math.min(0.18,k+0.006);draw()},250);
  draw();
})();
// 拡大を止める（ピンチ・ダブルタップ・Ctrl+ホイール）。iOS は user-scalable=no を無視するので JS でも止める
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険: JS が動いたか（__jsUp）で判定する。読み込み中を失敗と出さない
(function(){
  var errs=[];
  window.addEventListener('error',function(e){var tg=e.target;if(tg&&tg!==window&&(tg.src||tg.href))errs.push('load failed: '+(tg.src||tg.href));else errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))},true);
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  function show(){
    if(window.__jsUp||document.getElementById('boot-err')) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  }
  setTimeout(function(){if(errs.length)show()},9000);
  setTimeout(show,45000);
})();
</script>
<script src="sfx.js?v=6"></script>
<script>
// フォント2つを待ってから本体を動かす（家の張り紙に字を描くため）。遅い回線でも1.5秒で先へ進む
(function(){
  var n=0,tick=function(){n++;window.__bootSet(n*0.1)};
  var f=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 16px "BIZ UDPGothic"').then(tick,tick),document.fonts.load('600 16px "Klee One"').then(tick,tick)]):Promise.resolve();
  Promise.race([f,new Promise(function(r){setTimeout(r,1500)})]).then(function(){return import('./dist/game.js?v=6')}).catch(function(e){console.error(e);throw e});
})();
</script>
</body>
</html>
